<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RADAR 115</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --green: #00ff41;
    --green-dim: #00aa2a;
    --green-dark: #003311;
    --bg: #020a03;
    --red: #ff3c3c;
    --blue: #00cfff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px);
    pointer-events: none; z-index: 1000;
  }

  header {
    width: 100%; max-width: 480px;
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--green-dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo { font-family: 'Orbitron', monospace; font-size: 1.3rem; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 12px var(--green), 0 0 30px var(--green-dim); }
  .logo span { color: var(--green-dim); font-size: 0.7rem; letter-spacing: 2px; display: block; }

  .status-pill { display: flex; align-items: center; gap: 7px; font-size: 0.65rem; color: var(--green-dim); letter-spacing: 1px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: pdot 1.2s infinite; }
  .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
  @keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  main { width: 100%; max-width: 480px; padding: 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 1; }

  .radar-wrap { position: relative; width: min(92vw, 380px); height: min(92vw, 380px); }
  canvas#radar { width: 100%; height: 100%; border-radius: 50%; display: block; filter: drop-shadow(0 0 20px var(--green-dim)); }
  .range-label { position: absolute; bottom: 10px; right: 12px; font-size: 0.65rem; color: var(--green-dim); letter-spacing: 2px; }

  /* Indicatore heading bussola */
  .compass-hud {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', monospace; font-size: 0.6rem; letter-spacing: 2px;
    color: var(--green-dim); background: rgba(2,10,3,0.7);
    padding: 3px 8px; border-radius: 4px; border: 1px solid var(--green-dark);
    white-space: nowrap; pointer-events: none;
  }
  .compass-hud.active { color: var(--green); border-color: var(--green-dim); }

  /* Accuracy badge */
  .acc-badge {
    position: absolute; top: 8px; right: 10px;
    font-size: 0.58rem; color: var(--green-dim); letter-spacing: 1px;
    background: rgba(2,10,3,0.7); padding: 2px 6px; border-radius: 3px;
    border: 1px solid var(--green-dark); pointer-events: none;
  }
  .acc-badge.good { color: #00ff41; border-color: #003311; }
  .acc-badge.mid  { color: #ffe000; border-color: #443300; }
  .acc-badge.bad  { color: #ff3c3c; border-color: #440000; }

  .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; }

  .identity-row {
    display: flex; gap: 8px; align-items: center;
    background: var(--green-dark); border: 1px solid var(--green-dim);
    border-radius: 6px; padding: 8px 10px;
  }
  .identity-row label { font-size: 0.65rem; color: var(--green-dim); letter-spacing: 2px; white-space: nowrap; }

  input[type="text"] {
    background: transparent; border: none; border-bottom: 1px solid var(--green-dim);
    color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
    padding: 4px 6px; outline: none; flex: 1; min-width: 0;
  }
  input[type="text"]:focus { border-bottom-color: var(--green); }

  .color-picker-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .color-picker-row label { font-size: 0.65rem; color: var(--green-dim); letter-spacing: 2px; white-space: nowrap; }
  .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all .15s; flex-shrink: 0; }
  .color-swatch.selected { border-color: #fff; box-shadow: 0 0 10px currentColor; transform: scale(1.2); }

  button { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; letter-spacing: 2px; cursor: pointer; border-radius: 4px; padding: 8px 14px; transition: all .15s; white-space: nowrap; }
  .btn-green { background: var(--green-dark); color: var(--green); border: 1px solid var(--green-dim); }
  .btn-green:active, .btn-green:hover { background: var(--green); color: var(--bg); box-shadow: 0 0 12px var(--green); }
  .btn-red { background: #1a0000; color: var(--red); border: 1px solid #882222; }
  .btn-red:active { background: var(--red); color: var(--bg); }
  .btn-blue { background: #001a22; color: var(--blue); border: 1px solid #005577; }
  .btn-blue:active, .btn-blue:hover { background: var(--blue); color: var(--bg); }

  .input-row { display: flex; gap: 8px; align-items: center; }

  .range-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  input[type=range] { -webkit-appearance: none; flex: 1; height: 4px; background: var(--green-dark); border-radius: 2px; outline: none; border: 1px solid var(--green-dim); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); cursor: pointer; }
  .range-val { font-size: 0.75rem; color: var(--green); min-width: 56px; text-align: right; }

  .room-box { width: 100%; background: var(--green-dark); border: 1px solid var(--green-dim); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .room-header { font-size: 0.65rem; color: var(--green-dim); letter-spacing: 2px; font-family: 'Orbitron', monospace; }
  .room-link { font-size: 0.7rem; color: var(--green); word-break: break-all; border: 1px dashed var(--green-dim); padding: 6px 8px; border-radius: 4px; cursor: pointer; line-height: 1.4; }
  .room-link:hover { border-color: var(--green); }

  .section-title { font-family: 'Orbitron', monospace; font-size: 0.65rem; letter-spacing: 3px; color: var(--green-dim); border-bottom: 1px solid var(--green-dark); padding-bottom: 6px; margin-bottom: 8px; }
  #friends-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .friend-item { background: var(--green-dark); border: 1px solid var(--green-dim); border-radius: 4px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; gap: 8px; }
  .friend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .friend-name { color: var(--green); font-weight: bold; flex: 1; }
  .friend-dist { font-size: 0.65rem; color: var(--green-dim); letter-spacing: 1px; white-space: nowrap; }

  #log { font-size: 0.65rem; color: var(--green-dim); letter-spacing: 1px; min-height: 16px; text-align: center; }

  .copied-flash { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--green); color: var(--bg); font-family: 'Orbitron', monospace; font-size: 0.9rem; letter-spacing: 3px; padding: 12px 24px; border-radius: 6px; z-index: 900; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .copied-flash.show { opacity: 1; }

  #my-color-preview { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; transition: background .2s, box-shadow .2s; }

  /* Orientation toggle button */
  .orient-btn {
    position: absolute; bottom: 10px; left: 10px;
    font-family: 'Orbitron', monospace; font-size: 0.6rem; letter-spacing: 1px;
    background: rgba(2,10,3,0.85); color: var(--green-dim);
    border: 1px solid var(--green-dark); border-radius: 20px;
    padding: 5px 10px; cursor: pointer; z-index: 10;
    transition: all .2s; white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
  }
  .orient-btn.auto-mode {
    color: var(--green); border-color: var(--green-dim);
    box-shadow: 0 0 8px rgba(0,255,65,0.3);
  }
  .orient-btn .ob-icon { font-size: 0.9rem; }

  /* North indicator: small triangle that rotates around center to show true north */
  .north-arrow {
    position: absolute;
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 16px solid #ff4444;
    filter: drop-shadow(0 0 6px #ff3333);
    pointer-events: none; z-index: 20;
    /* transform-origin at center of radar — set via JS */
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--green-dark); }
  ::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 2px; }
</style>

</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyBgL6IEgrnxKkqhUWBvxMNIOlLYB4gFZk4",
  authDomain: "radar-b871d.firebaseapp.com",
  databaseURL: "https://radar-b871d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "radar-b871d",
  storageBucket: "radar-b871d.firebasestorage.app",
  messagingSenderId: "981308908775",
  appId: "1:981308908775:web:1b5bbc396849f12a166e42"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const COLORS = [
  { hex:'#00cfff', label:'Ciano'   },
  { hex:'#00ff41', label:'Verde'   },
  { hex:'#ffe000', label:'Giallo'  },
  { hex:'#ff8c00', label:'Arancio' },
  { hex:'#ff3c3c', label:'Rosso'   },
  { hex:'#ff5fdf', label:'Rosa'    },
  { hex:'#b066ff', label:'Viola'   },
  { hex:'#ffffff', label:'Bianco'  },
];

// ── GPS PRECISION ENGINE ──
// Kalman adattivo (process noise varia con l'accuracy del fix)
class AdaptiveKalman {
  constructor() {
    this.P  = 1;
    this.x  = null;
    this.Q  = 0.0000001;   // process noise molto basso = fiducia nella predizione
  }
  update(z, accMeters) {
    // R (measurement noise) proporzionale all'accuracy reale dichiarata dal chip
    // convertiamo accuracy in gradi: 1° lat ≈ 111320m
    const R = Math.pow(accMeters / 111320, 2);
    if (this.x === null) { this.x = z; return z; }
    this.P += this.Q;
    const K = this.P / (this.P + R);
    this.x += K * (z - this.x);
    this.P *= (1 - K);
    return this.x;
  }
  reset(z) { this.x = z; this.P = 1; }
}

// Buffer degli ultimi N fix buoni — media pesata per accuracy
class GpsBuffer {
  constructor(maxSize = 8) {
    this.buf = [];
    this.maxSize = maxSize;
  }
  push(lat, lon, acc) {
    // Scarta fix con accuracy peggiore di 5× il migliore nel buffer (outlier)
    if (this.buf.length >= 3) {
      const best = Math.min(...this.buf.map(b => b.acc));
      if (acc > best * 5 && acc > 30) return; // outlier, ignora
    }
    this.buf.push({ lat, lon, acc });
    if (this.buf.length > this.maxSize) this.buf.shift();
  }
  // Media pesata: peso = 1/acc² (fix più precisi pesano di più)
  get() {
    if (!this.buf.length) return null;
    let wLat=0, wLon=0, wSum=0;
    this.buf.forEach(b => {
      const w = 1 / (b.acc * b.acc);
      wLat += b.lat * w;
      wLon += b.lon * w;
      wSum += w;
    });
    return { lat: wLat/wSum, lon: wLon/wSum };
  }
  reset() { this.buf = []; }
}

const kalmanLat = new AdaptiveKalman();
const kalmanLon = new AdaptiveKalman();
const gpsBuffer = new GpsBuffer(8);

// ── STATE ──
const state = {
  running:    false,
  myPos:      null,           // {lat, lon} filtrato
  myRawPos:   null,           // raw per confronto
  myAccuracy: null,
  myName:     'ME',
  myColor:    '#00cfff',
  myId:       'u_' + Math.random().toString(36).substr(2, 9),
  range:      500,
  watchId:    null,
  scanAngle:  0,
  animId:     null,
  room:       'default',
  peers:      {},
  peerRef:    null,
  unsubscribe: null,
  pushTimer:  null,

  // Bussola
  heading:       null,   // gradi 0-360, 0=nord
  headingSmooth: 0,
  compassActive: false,
  orientMode:    'north',   // 'north' | 'auto'
};

// ── CANVAS ──
const canvas = document.getElementById('radar');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W/2, CY = H/2;
const R  = W/2 - 28;

// ── COLOR PICKER ──
function updateColorPreview() {
  const p = document.getElementById('my-color-preview');
  p.style.background = state.myColor;
  p.style.boxShadow  = `0 0 10px ${state.myColor}`;
}

function buildColorPicker() {
  const wrap = document.getElementById('color-picker');
  wrap.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c.hex === state.myColor ? ' selected' : '');
    sw.style.background = c.hex;
    sw.style.boxShadow  = c.hex === state.myColor ? `0 0 10px ${c.hex}` : 'none';
    sw.title = c.label;
    sw.onclick = () => {
      state.myColor = c.hex;
      buildColorPicker();
      updateColorPreview();
      try { localStorage.setItem('r115_color', state.myColor); } catch(e){}
      if (state.running) pushMyPosition();
    };
    wrap.appendChild(sw);
  });
  updateColorPreview();
}

// ── ORIENTATION MODE ──
// orientMode: 'north' = nord sempre in cima (classico)
//             'auto'  = il radar ruota seguendo l'heading del telefono

window.toggleOrientMode = function() {
  if (state.orientMode === 'north') {
    // Passa ad AUTO — richiede permesso bussola
    requestCompassPermission(() => {
      state.orientMode = 'auto';
      document.getElementById('orient-btn').classList.add('auto-mode');
      document.getElementById('orient-icon').textContent = '🧭';
      document.getElementById('orient-label').textContent = 'AUTO';
      document.getElementById('north-arrow').style.display = 'block';
    });
  } else {
    state.orientMode = 'north';
    state.compassActive = false;
    state.headingSmooth = 0;
    document.getElementById('orient-btn').classList.remove('auto-mode');
    document.getElementById('orient-icon').textContent = '🔒';
    document.getElementById('orient-label').textContent = 'NORD FISSO';
    document.getElementById('north-arrow').style.display = 'none';
    document.getElementById('compass-hud').textContent = 'HDG ---°';
    document.getElementById('compass-hud').classList.remove('active');
  }
};

function requestCompassPermission(onGranted) {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS 13+
    DeviceOrientationEvent.requestPermission()
      .then(r => {
        if (r === 'granted') { bindOrientation(); onGranted(); }
        else setLog('⚠️ Permesso bussola negato — vai in Impostazioni Safari');
      })
      .catch(() => setLog('⚠️ Bussola non disponibile'));
  } else if (window.DeviceOrientationEvent) {
    bindOrientation();
    onGranted();
  } else {
    setLog('⚠️ Bussola non supportata su questo dispositivo');
  }
}

let _orientBound = false;
function bindOrientation() {
  if (_orientBound) return;
  _orientBound = true;
  // Preferisce absolute (nord geografico), fallback su normale
  window.addEventListener('deviceorientationabsolute', onOrientation, true);
  window.addEventListener('deviceorientation', onOrientation, true);
}

// ── Telefono PIATTO: usa beta/gamma invece di alpha ──
// Quando il telefono è orizzontale (beta ≈ 0, gamma ≈ 0), 
// alpha è ancora valido ma potrebbe essere instabile su alcuni device.
// Usiamo webkitCompassHeading quando disponibile (iOS) — già compensato.
// Su Android applichiamo correzione per schermo verticale vs orizzontale.
function computeHeading(e) {
  // iOS Safari: webkitCompassHeading è sempre corretto indipendentemente 
  // dall'orientazione del dispositivo
  if (e.webkitCompassHeading != null) {
    return e.webkitCompassHeading;
  }

  if (e.alpha == null) return null;

  // Android: alpha = rotazione attorno asse Z (yaw)
  // Se assoluto, 0 = nord; senso antiorario → invertiamo
  const alpha = e.alpha;
  const beta  = e.beta  || 0;   // inclinazione avanti/indietro (-180..180)
  const gamma = e.gamma || 0;   // inclinazione sinistra/destra (-90..90)

  // Telefono piatto (face-up): beta≈0, gamma≈0 → alpha è direttamente heading
  // Telefono verticale (portrait): beta≈90 → orientazione normale
  // Applichiamo la compensazione della tilt per avere heading stabile
  // in qualsiasi posizione del telefono
  
  // Converti in radianti
  const aR = alpha * Math.PI / 180;
  const bR = beta  * Math.PI / 180;
  const gR = gamma * Math.PI / 180;

  // Matrice di rotazione → estrai heading compensato per tilt
  // Formula standard per compass tilt compensation
  const x = Math.cos(aR) * Math.cos(gR) + Math.sin(aR) * Math.sin(bR) * Math.sin(gR);
  const y = Math.sin(aR) * Math.cos(bR);
  
  let heading = Math.atan2(-y, x) * 180 / Math.PI;
  if (heading < 0) heading += 360;

  // Se absolute=true il nord è già calibrato
  if (!e.absolute) {
    // Non assoluto: usiamo comunque il valore, ma avvisiamo
    // (non c'è modo di correggere senza magnetometro calibrato)
  }

  return heading;
}

function onOrientation(e) {
  // Ignora evento non-absolute se già ricevuto uno absolute (evita doppio handler)
  if (e.type === 'deviceorientation' && e.absolute) return; // è già gestito dall'altro listener

  const heading = computeHeading(e);
  if (heading === null) return;

  state.compassActive = true;
  state.heading = heading;

  if (state.orientMode === 'auto') {
    const hud = document.getElementById('compass-hud');
    hud.textContent = `HDG ${Math.round(heading).toString().padStart(3,'0')}°`;
    hud.classList.add('active');

    // Triangolino nord: posizionato sul bordo, punta al vero nord
    const arrow = document.getElementById('north-arrow');
    if (arrow && arrow.style.display !== 'none') {
      // northAngle = dove si trova il nord reale sul cerchio
      // Il radar è ruotato di -heading, quindi il nord è a -heading gradi dal top
      const northDeg = -state.headingSmooth; // angolo sul cerchio (0=top=nord)
      const northRad = northDeg * Math.PI / 180;
      const wrap = document.querySelector('.radar-wrap');
      const size = wrap ? wrap.offsetWidth : 380;
      const cx = size / 2;
      const edgeR = size / 2 - 10; // distanza dal centro al bordo interno
      // Posizione del triangolo: sul cerchio, puntato verso il centro
      const nx = cx + Math.sin(-northRad) * edgeR;
      const ny = cx - Math.cos(-northRad) * edgeR;
      // Rotazione: il triangolo ha base in basso, punta verso il basso di default
      // Per puntare verso il centro dal bordo, ruotiamo di 180° + angolo
      const rot = northDeg + 180;
      arrow.style.left      = (nx - 7) + 'px';
      arrow.style.top       = (ny - 8) + 'px';
      arrow.style.transform = `rotate(${rot}deg)`;
    }
  }
}

// startCompass ora è solo un alias (il vero avvio è via bottone)
function startCompass() {
  // Non fare nulla all'avvio — l'utente sceglie la modalità col bottone
  // Al primo avvio siamo in NORD FISSO
}

// ── INIT ──
function init() {
  try {
    const n = localStorage.getItem('r115_name');  if (n) { state.myName = n; document.getElementById('my-name').value = n; }
    const c = localStorage.getItem('r115_color'); if (c) state.myColor = c;
    const r = localStorage.getItem('r115_room');  if (r) document.getElementById('room-id').value = r;
  } catch(e){}

  const p = new URLSearchParams(window.location.search);
  const rp = p.get('room');
  if (rp) { document.getElementById('room-id').value = rp; setLog('📡 Stanza: ' + rp + ' — premi START'); }

  buildColorPicker();
  animate();
}

// ── START ──
window.startRadar = function() {
  state.myName  = document.getElementById('my-name').value.trim() || 'ME';
  state.room    = document.getElementById('room-id').value.trim() || 'default';
  document.getElementById('room-id').value = state.room;

  try {
    localStorage.setItem('r115_name',  state.myName);
    localStorage.setItem('r115_color', state.myColor);
    localStorage.setItem('r115_room',  state.room);
  } catch(e){}

  if (!navigator.geolocation) { setLog('❌ Geolocation non supportata'); return; }
  setLog('🛰 Acquisizione GPS...');

  // ── GPS ad altissima precisione ──
  const opts = {
    enableHighAccuracy: true,
    timeout:            30000,
    maximumAge:         0      // ZERO cache — sempre posizione fresca
  };

  state.watchId = navigator.geolocation.watchPosition(
    pos => {
      const rawLat = pos.coords.latitude;
      const rawLon = pos.coords.longitude;
      const acc    = pos.coords.accuracy;

      state.myAccuracy = acc;

      // 1) Kalman adattivo: R scala con accuracy reale del chip
      const kLat = kalmanLat.update(rawLat, acc);
      const kLon = kalmanLon.update(rawLon, acc);

      // 2) Accumula nel buffer (scarta outlier automaticamente)
      gpsBuffer.push(kLat, kLon, acc);

      // 3) Media pesata del buffer = posizione finale ultra-smussata
      const best = gpsBuffer.get();
      const fLat = best ? best.lat : kLat;
      const fLon = best ? best.lon : kLon;

      // Reset se spostamento fisico reale > 200m
      if (state.myPos) {
        const jumpM = haversine(state.myPos.lat, state.myPos.lon, rawLat, rawLon);
        if (jumpM > 200) {
          kalmanLat.reset(rawLat); kalmanLon.reset(rawLon);
          gpsBuffer.reset();
        }
      }

      state.myPos    = { lat: fLat, lon: fLon };
      state.myRawPos = { lat: rawLat, lon: rawLon };
      state.running  = true;

      document.getElementById('status-dot').classList.add('active');
      document.getElementById('status-txt').textContent = 'LIVE';

      // Accuracy badge
      updateAccBadge(acc);

      setLog(`📍 ±${Math.round(acc)}m — ${fLat.toFixed(7)}, ${fLon.toFixed(7)}`);
      document.getElementById('range-label').textContent = formatDist(state.range);

      pushMyPosition();
      listenPeers();
    },
    err => {
      state.running = false;
      document.getElementById('status-dot').classList.remove('active');
      document.getElementById('status-txt').textContent = 'OFFLINE';
      if (err.code === 1)      setLog('⛔ Permesso GPS negato');
      else if (err.code === 2) setLog('❌ Posizione non disponibile');
      else                     setLog('⏱ Timeout GPS — riprovo...');
    },
    opts
  );

  // Avvia bussola
  startCompass();
};

// ── ACCURACY BADGE ──
function updateAccBadge(acc) {
  const b = document.getElementById('acc-badge');
  b.textContent = `±${Math.round(acc)}m`;
  b.className = 'acc-badge ' + (acc <= 8 ? 'good' : acc <= 25 ? 'mid' : 'bad');
}

// ── STOP ──
window.stopRadar = function() {
  if (state.watchId !== null) { navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
  if (state.peerRef) try { remove(state.peerRef); } catch(e){}
  if (state.unsubscribe) { state.unsubscribe(); state.unsubscribe = null; }
  if (state.pushTimer) { clearTimeout(state.pushTimer); state.pushTimer = null; }
  state.running = false;
  state.peers   = {};
  document.getElementById('status-dot').classList.remove('active');
  document.getElementById('status-txt').textContent = 'OFFLINE';
  document.getElementById('acc-badge').textContent = 'ACC --';
  document.getElementById('acc-badge').className = 'acc-badge bad';
  setLog('■ Radar spento');
  renderFriendsList();
};

// ── PUSH POSITION ──
function pushMyPosition() {
  if (!state.myPos || !state.running) return;
  const path = `rooms/${state.room}/users/${state.myId}`;
  state.peerRef = ref(db, path);
  set(state.peerRef, {
    name:  state.myName,
    color: state.myColor,
    lat:   state.myPos.lat,
    lon:   state.myPos.lon,
    ts:    Date.now()
  });
  if (state.pushTimer) clearTimeout(state.pushTimer);
  state.pushTimer = setTimeout(pushMyPosition, 2000);
}

// ── LISTEN PEERS ──
function listenPeers() {
  if (state.unsubscribe) return;
  const roomRef = ref(db, `rooms/${state.room}/users`);
  state.unsubscribe = onValue(roomRef, snapshot => {
    const data = snapshot.val() || {};
    state.peers = {};
    const now = Date.now();
    Object.entries(data).forEach(([id, u]) => {
      if (id === state.myId) return;
      if (now - u.ts > 30000) return;
      state.peers[id] = u;
    });
    renderFriendsList();
  });
}

// ── SHARE ──
window.shareRoom = function() {
  const roomId = document.getElementById('room-id').value.trim() || 'default';
  state.room = roomId;
  const url = `${location.origin}${location.pathname}?room=${encodeURIComponent(roomId)}`;
  document.getElementById('room-link-txt').textContent = url;
  document.getElementById('room-link-box').style.display = 'flex';
  if (navigator.share) navigator.share({ title: 'Radar 115', url }).catch(()=>{});
};

window.copyRoomLink = function() {
  const url = document.getElementById('room-link-txt').textContent;
  navigator.clipboard.writeText(url).then(showCopied).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showCopied();
  });
};

window.updateRange = function(val) {
  state.range = parseInt(val);
  document.getElementById('range-val').textContent   = formatDist(state.range);
  document.getElementById('range-label').textContent = formatDist(state.range);
};

// ── SMOOTH HEADING ──
// Interpolazione angolare che non salta da 359→0
function lerpAngle(current, target, t) {
  let diff = ((target - current + 540) % 360) - 180;
  return (current + diff * t + 360) % 360;
}

// ── DRAW ──
function drawRadar() {
  ctx.clearRect(0, 0, W, H);

  // Smooth heading — solo in modalità AUTO
  if (state.orientMode === 'auto' && state.compassActive && state.heading !== null) {
    state.headingSmooth = lerpAngle(state.headingSmooth, state.heading, 0.1);
  } else if (state.orientMode === 'north') {
    // In NORD FISSO: riporta gradualmente a 0 se si cambia modalità
    state.headingSmooth = lerpAngle(state.headingSmooth, 0, 0.15);
  }

  // In AUTO il radar ruota; in NORD FISSO hdgRad=0 (nord sempre in cima)
  const hdgRad = (state.orientMode === 'auto' && state.compassActive)
    ? -(state.headingSmooth * Math.PI / 180)
    : 0;

  // BG circle
  ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R+14,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = '#010901'; ctx.fillRect(0,0,W,H); ctx.restore();

  // ── Tutto il contenuto del radar ruota secondo heading ──
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(hdgRad);
  ctx.translate(-CX, -CY);

  // Rings
  ctx.strokeStyle = '#002208'; ctx.lineWidth = 2;
  [0.25,0.5,0.75,1].forEach(f => { ctx.beginPath(); ctx.arc(CX,CY,R*f,0,Math.PI*2); ctx.stroke(); });

  // Crosshair
  ctx.strokeStyle = '#002208'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(CX-R,CY); ctx.lineTo(CX+R,CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX,CY-R); ctx.lineTo(CX,CY+R); ctx.stroke();

  // Cardinals (ruotano con il radar = sono punti cardinali veri)
  ctx.font='bold 24px Orbitron, monospace'; ctx.fillStyle='#00aa2a';
  ctx.textAlign='center';

  // N in rosso per distinguerlo
  ctx.fillStyle='#ff4444'; ctx.shadowBlur=8; ctx.shadowColor='#ff4444';
  ctx.fillText('N', CX, CY-R+30);
  ctx.shadowBlur=0;

  ctx.fillStyle='#00aa2a';
  ctx.fillText('S', CX, CY+R-12);
  ctx.textAlign='left';  ctx.fillText('E', CX+R-30, CY+9);
  ctx.textAlign='right'; ctx.fillText('W', CX-R+30, CY+9);

  // Sweep
  if (state.running) {
    for (let i = 0; i < 32; i++) {
      const a = state.scanAngle - (Math.PI*0.65*i/32);
      ctx.save(); ctx.beginPath(); ctx.moveTo(CX,CY);
      ctx.arc(CX,CY,R,a,a+Math.PI*0.65/32);
      ctx.lineTo(CX,CY); ctx.fillStyle=`rgba(0,255,65,${0.13*(1-i/32)})`; ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.strokeStyle='#00ff41'; ctx.lineWidth=2.5; ctx.shadowBlur=14; ctx.shadowColor='#00ff41';
    ctx.beginPath(); ctx.moveTo(CX,CY);
    ctx.lineTo(CX+Math.cos(state.scanAngle)*R, CY+Math.sin(state.scanAngle)*R);
    ctx.stroke(); ctx.restore();
  }

  // Outer border
  ctx.save(); ctx.strokeStyle='#00ff41'; ctx.lineWidth=3; ctx.shadowBlur=22; ctx.shadowColor='#00ff41';
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.stroke(); ctx.restore();

  // Clip circle for dots
  ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R-2,0,Math.PI*2); ctx.clip();

  // Peers
  Object.values(state.peers).forEach(p => {
    if (!state.myPos) return;
    const {x,y} = latLonToXY(p.lat, p.lon);
    const dist  = haversine(state.myPos.lat, state.myPos.lon, p.lat, p.lon);
    const col   = p.color || '#00cfff';
    const inRange = dist <= state.range;

    ctx.save();
    ctx.globalAlpha = inRange ? 1 : 0.3;
    ctx.shadowBlur  = 24; ctx.shadowColor = col;
    ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2);
    ctx.fillStyle = col; ctx.fill();
    ctx.restore();

    if (inRange) {
      const ph = (state.scanAngle/(Math.PI*2))%1;
      ctx.save(); ctx.globalAlpha = 1-ph;
      ctx.beginPath(); ctx.arc(x,y,14+24*ph,0,Math.PI*2);
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    }

    // Nome e distanza — contro-ruotati per restare leggibili
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-hdgRad);   // contro-rotazione: il testo resta sempre dritto
    ctx.globalAlpha = inRange ? 1 : 0.4;
    ctx.font        = 'bold 26px Share Tech Mono, monospace';
    ctx.fillStyle   = col; ctx.shadowBlur = 10; ctx.shadowColor = col;
    ctx.textAlign   = 'center';
    ctx.fillText(p.name, 0, -22);
    ctx.font = '20px Share Tech Mono, monospace';
    ctx.globalAlpha *= 0.75;
    ctx.fillText(formatDist(dist), 0, 34);
    ctx.restore();
  });

  // ME — sempre al centro, disegnato DOPO i peer (sopra a tutto)
  const meCol = state.myColor;

  // Sfondo nero sotto per staccarsi dai peer sovrapposti
  ctx.save();
  ctx.beginPath(); ctx.arc(CX,CY,22,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fill();
  ctx.restore();

  // Dot colorato
  ctx.save();
  ctx.shadowBlur=28; ctx.shadowColor=meCol;
  ctx.beginPath(); ctx.arc(CX,CY,18,0,Math.PI*2);
  ctx.fillStyle=meCol; ctx.fill();
  ctx.restore();

  // Anello bianco fisso — identifica sempre il TUO punto
  ctx.save();
  ctx.beginPath(); ctx.arc(CX,CY,22,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();

  // Anello colorato esterno
  ctx.save();
  ctx.beginPath(); ctx.arc(CX,CY,28,0,Math.PI*2);
  const r2=parseInt(meCol.slice(1,3),16), g2=parseInt(meCol.slice(3,5),16), b2=parseInt(meCol.slice(5,7),16);
  ctx.strokeStyle=`rgba(${r2},${g2},${b2},0.35)`; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();

  // Nome ME contro-ruotato
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(-hdgRad);
  ctx.font='bold 28px Share Tech Mono, monospace'; ctx.fillStyle=meCol;
  ctx.shadowBlur=12; ctx.shadowColor=meCol; ctx.textAlign='center';
  ctx.fillText(state.myName, 0, -28);
  ctx.restore();

  ctx.restore(); // unclip

  ctx.restore(); // unrotate

  // Corners (fuori dalla rotazione — statici)
  drawCorners();

  // Mirino fisso al centro (non ruota)
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(CX-12,CY); ctx.lineTo(CX+12,CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX,CY-12); ctx.lineTo(CX,CY+12); ctx.stroke();
  ctx.restore();
}

function drawCorners() {
  const s=40; ctx.strokeStyle='#00ff41'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(16,16+s); ctx.lineTo(16,16); ctx.lineTo(16+s,16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-16-s,16); ctx.lineTo(W-16,16); ctx.lineTo(W-16,16+s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16,H-16-s); ctx.lineTo(16,H-16); ctx.lineTo(16+s,H-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-16-s,H-16); ctx.lineTo(W-16,H-16); ctx.lineTo(W-16,H-16-s); ctx.stroke();
}

// ── ANIMATE ──
function animate() {
  if (state.running) state.scanAngle = (state.scanAngle+0.025)%(Math.PI*2);
  drawRadar();
  updateNorthArrow();
  state.animId = requestAnimationFrame(animate);
}

function updateNorthArrow() {
  if (state.orientMode !== 'auto') return;
  const arrow = document.getElementById('north-arrow');
  if (!arrow || arrow.style.display === 'none') return;
  const wrap = document.querySelector('.radar-wrap');
  const size = wrap ? wrap.offsetWidth : 380;
  const cx = size / 2;
  const edgeR = size / 2 - 12;
  const northRad = state.headingSmooth * Math.PI / 180;
  // nord è nella direzione opposta alla rotazione del radar
  const nx = cx + Math.sin(northRad) * edgeR;
  const ny = cx - Math.cos(northRad) * edgeR;
  const rot = state.headingSmooth + 180;
  arrow.style.left      = (nx - 7) + 'px';
  arrow.style.top       = (ny - 8) + 'px';
  arrow.style.transform = `rotate(${rot}deg)`;
}

// ── FRIENDS LIST ──
function renderFriendsList() {
  const el = document.getElementById('friends-list');
  const peers = Object.values(state.peers);
  if (!peers.length) {
    el.innerHTML = '<div style="font-size:0.7rem;color:var(--green-dim);text-align:center;padding:10px">Nessun segnale</div>';
    return;
  }
  el.innerHTML = peers.map(p => {
    const dist = state.myPos ? haversine(state.myPos.lat,state.myPos.lon,p.lat,p.lon) : null;
    const col  = p.color || '#00cfff';
    return `<div class="friend-item">
      <div class="friend-dot" style="background:${col};box-shadow:0 0 8px ${col}"></div>
      <span class="friend-name" style="color:${col}">${p.name}</span>
      <span class="friend-dist">${dist!==null ? formatDist(dist) : '?'}</span>
    </div>`;
  }).join('');
}

// ── GEO MATH ──
function haversine(lat1,lon1,lat2,lon2) {
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function latLonToXY(lat,lon) {
  if (!state.myPos) return {x:CX,y:CY};
  const dy_m = -(lat-state.myPos.lat)*111320;
  const dx_m  = (lon-state.myPos.lon)*111320*Math.cos(state.myPos.lat*Math.PI/180);
  const scale = R/state.range;
  return { x: Math.round(CX+dx_m*scale), y: Math.round(CY+dy_m*scale) };
}

function formatDist(m) { return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m'; }
function setLog(msg)    { document.getElementById('log').textContent = msg; }
function showCopied()   { const e=document.getElementById('copied-flash'); e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1200); }

window.addEventListener('beforeunload', () => {
  if (state.peerRef) try { remove(state.peerRef); } catch(e){}
});

init();
</script>
