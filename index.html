<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#060410"/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script>
    const mf={name:"Noi",short_name:"Noi",display:"fullscreen",orientation:"any",background_color:"#060410",theme_color:"#060410",start_url:"./",icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%23060410'/><text y='380' font-size='340' font-family='sans-serif' fill='%239b5dff'>♥</text></svg>",sizes:"512x512",type:"image/svg+xml"}]};
    const bl=new Blob([JSON.stringify(mf)],{type:'application/json'});
    const lk=document.createElement('link');lk.rel='manifest';lk.href=URL.createObjectURL(bl);
    document.currentScript.after(lk);
  </script>
  <title>Noi</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      width:100%;height:100%;height:100dvh;
      overflow:hidden;touch-action:none;
      overscroll-behavior:none;
      -webkit-tap-highlight-color:transparent;
      font-family:'Inter',system-ui,sans-serif;
    }

    /* ── STARFIELD BG ── */
    #stars{position:fixed;inset:0;z-index:0;
      background:radial-gradient(ellipse at 42% 46%,#1a0a2e 0%,#0d0618 50%,#060410 100%);}

    /* ── SCREENS ── */
    .screen{
      position:fixed;inset:0;z-index:10;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      transition:opacity .5s ease, transform .5s ease;
    }
    .screen.hidden{opacity:0;pointer-events:none;transform:scale(0.97);}

    /* ── SCREEN 1: HOME ── */
    #screen-home{gap:clamp(10px,3vmin,22px); z-index: 20;}
    .home-title{
      font-family:'Caveat',cursive;
      font-size:clamp(3.5rem,15vmin,10rem);
      font-weight:600;color:#fff;
      background:linear-gradient(135deg,#fff 0%,#c084fc 45%,#9b5dff 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      line-height:1;letter-spacing:0.02em;
    }
    .home-sub{
      font-size:clamp(11px,2.5vmin,15px);
      letter-spacing:0.35em;text-transform:uppercase;
      color:rgba(200,170,255,0.5);
    }
    .home-date{
      font-family:'Caveat',cursive;
      font-size:clamp(14px,3vmin,20px);
      color:rgba(200,170,255,0.7);
      margin-top:4px;
    }
    .btn-enter{
      margin-top:clamp(16px,4vmin,32px);
      padding:12px 32px;
      border:1px solid rgba(155,93,255,0.45);
      border-radius999px;
      background:rgba(155,93,255,0.12);
      backdrop-filter:blur(8px);
      color:#d4aaff;
      font-size:13px;letter-spacing:0.2em;text-transform:uppercase;
      cursor:pointer;transition:all .2s;
      pointer-events: auto !important;
    }
    .btn-enter:hover{background:rgba(155,93,255,0.25);border-color:rgba(155,93,255,0.7);}

    /* ── SCREEN 2: TIMELINE MESI (MAGNETICO) ── */
    #screen-months{
      justify-content:center;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .months-header{
      width:100%;display:flex;align-items:center;
      padding:clamp(14px,4vmin,28px) clamp(16px,5vw,32px) clamp(8px,2vmin,16px);
      gap:14px;
      position:absolute;top:0;left:0;z-index: 30;
    }
    .btn-back{
      background:none;border:none;
      color:rgba(155,93,255,0.7);cursor:pointer;
      font-size:22px;line-height:1;padding:4px;
    }
    .months-title{
      font-family:'Caveat',cursive;
      font-size:clamp(20px,5vmin,34px);
      color:#e0c8ff;font-weight:600;
    }
    
    .months-scroll{
      width:100%;
      overflow-x:auto;overflow-y:hidden;
      touch-action:pan-x;
      display:flex;flex-direction:row;
      align-items:center;
      scrollbar-width:none;
      scroll-snap-type:x mandatory;
      scroll-behavior: smooth;
      padding-left: calc(50vw - 150px);
      padding-right: calc(50vw - 150px);
      height: 420px;
    }
    .months-scroll::-webkit-scrollbar{display:none;}

    .month-card{
      width: 300px;
      height: 250px;
      flex-shrink:0;
      scroll-snap-align:center;
      border-radius:24px;
      border:1px solid rgba(155,93,255,0.15);
      background:rgba(20,8,45,0.4);
      backdrop-filter:blur(8px);
      padding: 24px;
      cursor:pointer;
      position:relative;overflow:hidden;
      
      transform: scale(0.85);
      opacity: 0.35;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                  opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                  border-color 0.3s, background 0.3s;
      
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .month-card.active-center {
      width: 315px;
      height: 290px;
      transform: scale(1.05);
      opacity: 1;
      background: rgba(35, 12, 70, 0.75);
      border-color: rgba(155, 93, 255, 0.6);
      box-shadow: 0 12px 35px rgba(155, 93, 255, 0.22);
    }

    .month-card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(155,93,255,0.07) 0%,transparent 60%);
      pointer-events:none;
    }

    /* CARDS MESI FUTURI BLOCCATI */
    .month-card.future-locked {
      opacity: 0.12 !important;
      cursor: default !important;
      pointer-events: none !important;
      border-style: dashed;
    }
    
    .mc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .mc-left{display:flex;flex-direction:column;gap:4px;}
    .mc-num{
      font-size:11px;
      letter-spacing:0.3em;text-transform:uppercase;
      color:rgba(155,93,255,0.7);
    }
    .mc-name{
      font-family:'Caveat',cursive;
      font-size: 42px;
      color:#e8d8ff;font-weight:600;line-height:1.1;
    }
    .mc-dates{
      font-size:13px;
      color:rgba(200,170,255,0.55);
      margin-top:4px;
    }
    .mc-badge{
      padding:6px 14px;border-radius:999px;
      font-size:10px;
      letter-spacing:0.15em;text-transform:uppercase;
      white-space:nowrap;
    }
    .mc-badge.current{background:rgba(155,93,255,0.3);color:#c084fc;border:1px solid rgba(155,93,255,0.5);font-weight:600;}
    .mc-badge.done{background:rgba(80,40,160,0.2);color:rgba(180,140,255,0.6);border:1px solid rgba(100,60,180,0.2);}
    .mc-badge.future{background:transparent;color:rgba(150,120,200,0.2);border:1px dashed rgba(100,70,140,0.2);}
    .mc-heart{font-size: 38px; opacity:0.5;}
    .mc-lock{font-size:22px;opacity:0.3;}
    
    .mc-progress{
      margin-top:auto; height:4px;border-radius:999px;
      background:rgba(155,93,255,0.15);overflow:hidden;
    }
    .mc-progress-fill{height:100%;border-radius:999px;
      background:linear-gradient(90deg,#9b5dff,#c084fc);}

    /* ── SCREEN 3: DETTAGLIO MESE ── */
    #screen-detail{justify-content:flex-start;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
    .detail-header{
      width:100%;display:flex;align-items:center;
      padding:clamp(14px,4vmin,28px) clamp(16px,5vw,32px) 0;
      gap:14px;
    }
    .detail-title{
      font-family:'Caveat',cursive;
      font-size:clamp(24px,6vmin,40px);
      color:#e0c8ff;font-weight:600;
    }
    .detail-sub{
      font-size:11px;letter-spacing:0.25em;
      text-transform:uppercase;color:rgba(180,150,255,0.45);
      padding:0 clamp(16px,5vw,32px);
      margin-bottom:clamp(10px,2.5vmin,18px);
    }

    /* Griglia giorni */
    .days-scroll{
      width:100%;flex:1;
      overflow-y:auto;overflow-x:hidden;
      touch-action:pan-y;
      padding:0 clamp(12px,4vw,28px) 24px;
      scrollbar-width:none;
    }
    .days-scroll::-webkit-scrollbar{display:none;}
    
    .days-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(clamp(65px,18vw,95px),1fr));
      gap:clamp(6px,1.5vmin,10px);
      align-items:center;
    }

    .day-card{
      aspect-ratio:3/4;
      border-radius:10px;
      background:#f5f0e8;
      display:flex;flex-direction:column;
      overflow:hidden;cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,0.4),0 1px 0 rgba(255,255,255,0.1) inset;
      transition:transform .18s ease,box-shadow .18s ease;
      transform:rotate(var(--r,0deg));
      position:relative;
    }
    .day-card:nth-child(odd){--r:-1.5deg;}
    .day-card:nth-child(even){--r:1deg;}
    .day-card:nth-child(3n){--r:2.5deg;}
    .day-card:hover{transform:rotate(0deg) scale(1.08);box-shadow:0 8px 24px rgba(0,0,0,0.6);z-index:2;}
    .day-photo{flex:1;background:#1a1228;position:relative;overflow:hidden;}
    .day-photo-inner{
      position:absolute;inset:0;
      background:linear-gradient(160deg,#1a0a2e,#0d0618);
      background-size: cover;
      background-position: center;
    }
    
    /* Indicatore cuore se il giorno ha già una foto salvata */
    .day-card.has-uploaded-photo .day-photo-inner::before {
      content: '♥';
      position: absolute; bottom: 6px; right: 8px;
      color: #9b5dff; font-size: 14px; z-index: 3;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .day-footer{
      background:#f5f0e8;
      padding:4px 6px 6px;
      display:flex;flex-direction:column;align-items:center;
      gap:1px;
    }
    .day-num{
      font-family:'Caveat',cursive;
      font-size:clamp(14px,3.5vmin,20px);
      color:#2a1a3a;font-weight:600;line-height:1;
    }
    .day-label{
      font-size:clamp(8px,1.8vmin,11px);
      color:#7a6080;text-transform:uppercase;letter-spacing:0.1em;
    }

    /* CARD GIORNO FUTURO BLOCCATO */
    .day-card.day-future-locked {
      background: rgba(25, 10, 50, 0.3) !important;
      border: 1px dashed rgba(155, 93, 255, 0.2) !important;
      box-shadow: none !important;
      cursor: default !important;
      pointer-events: none !important;
      transform: none !important;
    }
    .day-card.day-future-locked .day-photo {
      background: transparent !important;
    }
    .day-card.day-future-locked .day-photo-inner {
      display: flex; align-items: center; justify-content: center;
      background: transparent !important;
    }
    .day-card.day-future-locked .day-photo-inner::after {
      content: '🔒'; font-size: 16px; opacity: 0.35;
    }
    .day-card.day-future-locked .day-footer {
      background: transparent !important;
    }
    .day-card.day-future-locked .day-num {
      color: rgba(155, 93, 255, 0.4) !important;
    }
    .day-card.day-future-locked .day-label {
      color: rgba(155, 93, 255, 0.2) !important;
    }

    /* ── SCREEN 4: POLAROID FULLSCREEN (PIVOT 3D VERTICALE) ── */
    #screen-polaroid{
      background:rgba(6,4,16,0.96);
      backdrop-filter:blur(20px);
      perspective: 1200px;
    }
    #screen-polaroid.hidden{opacity:0;pointer-events:none;}
    .pol-header{
      position:absolute;top:0;left:0;right:0;
      display:flex;align-items:center;justify-content:space-between;
      padding:clamp(14px,4vmin,24px) clamp(16px,5vw,28px);
      padding-top:calc(clamp(14px,4vmin,24px) + env(safe-area-inset-top));
      z-index: 50;
    }
    .pol-daytitle{
      font-family:'Caveat',cursive;
      font-size:clamp(18px,5vmin,30px);
      color:#e0c8ff;font-weight:600;
    }
    .btn-close{
      background:rgba(155,93,255,0.15);
      border:1px solid rgba(155,93,255,0.3);
      border-radius:50%;width:36px;height:36px;
      color:#c084fc;font-size:18px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .15s;
    }
    .btn-close:hover{background:rgba(155,93,255,0.35);}
    
    #polaroid-stage{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:100%;height:100%;
      pointer-events:none;
      transform-style: preserve-3d;
      gap: 20px;
    }
    
    #big-polaroid{
      pointer-events:auto;
      width: clamp(240px, 68vmin, 380px);
      background: #f5f0e8;
      padding: clamp(14px, 3vmin, 22px);
      padding-bottom: clamp(45px, 12vmin, 80px);
      border-radius: 4px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 30px 90px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
      cursor: grab;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      transform-style: preserve-3d;
      will-change: transform;
      position: relative;
    }
    
    #big-polaroid::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 4px;
      pointer-events: none;
      background: linear-gradient(var(--light-deg, 120deg), rgba(255,255,255,0.15) 0%, transparent 50%, rgba(0,0,0,0.18) 100%);
      mix-blend-mode: overlay;
      transition: opacity 0.2s;
    }
    
    #big-polaroid.grabbed{
      cursor: grabbing;
    }
    #big-polaroid .big-photo{
      width:100%; aspect-ratio:1/1;
      background:linear-gradient(160deg,#1a0a2e 0%,#0d0618 100%);
      position:relative; overflow:hidden;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
      background-size: cover;
      background-position: center;
    }
    #big-polaroid .big-caption{
      text-align:center;
      margin-top: clamp(12px, 3vmin, 20px);
      font-family:'Caveat',cursive;
      font-size: clamp(18px, 4.5vmin, 28px);
      color:#2a1a3a; opacity:0.85;
      pointer-events:none;
    }

    /* Area pulsanti interattivi sotto la polaroid */
    .photo-controls {
      pointer-events: auto;
      display: flex; gap: 12px; z-index: 60;
    }
    .btn-upload {
      padding: 10px 22px;
      background: rgba(155, 93, 255, 0.25);
      border: 1px solid rgba(155, 93, 255, 0.6);
      border-radius: 999px;
      color: #e0c8ff; font-size: 12px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.15em;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-upload:hover {
      background: rgba(155, 93, 255, 0.45);
      box-shadow: 0 0 15px rgba(155,93,255,0.4);
    }

    .pol-hint{
      position:absolute; bottom:calc(env(safe-area-inset-bottom) + 12px);
      left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
      color:rgba(180,150,255,0.3); pointer-events:none;
    }

    /* Banner iOS */
    #ios-banner{
      position:fixed; bottom:calc(env(safe-area-inset-bottom) + 14px);
      left:50%; transform:translateX(-50%);
      background:rgba(20,6,40,0.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(155,93,255,0.4); border-radius:16px;
      padding:11px 20px 11px 16px; display:flex; align-items:center; gap:12px;
      font-family:system-ui,-apple-system,sans-serif; font-size:12px; color:#c8a8ff;
      white-space:nowrap; z-index:9999; animation:slideUp .4s ease;
    }
    #ios-banner strong{color:#e0ccff; font-weight:600;}
    #ios-banner button{background:none; border:none; color:#9b5dff; font-size:16px; cursor:pointer; padding:0 2px;}

    @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    .fadein{animation:fadeInUp .4s ease both;}
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<input type="file" id="secure-photo-input" accept="image/*" style="display:none;"/>

<div id="screen-home" class="screen">
  <div class="home-title">Noi</div>
  <div class="home-sub">Pietro &amp; Silvia</div>
  <div class="home-date" id="home-date"></div>
  <button class="btn-enter" id="btn-enter">Entra ♥</button>
</div>

<div id="screen-months" class="screen hidden">
  <div class="months-header">
    <button class="btn-back" id="back-months">←</button>
    <span class="months-title">I nostri mesi</span>
  </div>
  <div class="months-scroll" id="months-scroll"></div>
</div>

<div id="screen-detail" class="screen hidden">
  <div class="detail-header">
    <button class="btn-back" id="back-detail">←</button>
    <span class="detail-title" id="detail-title"></span>
  </div>
  <div class="detail-sub" id="detail-sub"></div>
  <div class="days-scroll">
    <div class="days-grid" id="days-grid"></div>
  </div>
</div>

<div id="screen-polaroid" class="screen hidden">
  <div class="pol-header">
    <span class="pol-daytitle" id="pol-daytitle"></span>
    <button class="btn-close" id="btn-close-pol">✕</button>
  </div>
  <div id="polaroid-stage">
    <div id="big-polaroid">
      <div class="big-photo" id="big-photo"></div>
      <div class="big-caption" id="big-caption"></div>
    </div>
    <div class="photo-controls">
      <button class="btn-upload" id="btn-trigger-upload">Aggiungi Foto ♥</button>
    </div>
  </div>
  <div class="pol-hint">Trascina lateralmente (Gira 3D)</div>
</div>

<script>
/* ═══════════════════════════════════════
   STARFIELD BG
═══════════════════════════════════════ */
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');
let W,H,stars=[];
const ARM_V=14,ARM_H=5.5,COUNT=200;

function resize(){
  const vp=window.visualViewport;
  W=canvas.width=vp?vp.width:window.innerWidth;
  H=canvas.height=vp?vp.height:window.innerHeight;
}
function rand(a,b){return a+Math.random()*(b-a);}
function spawnStars(){
  stars=Array.from({length:COUNT},()=>{
    const z=Math.pow(Math.random(),1.8),sp=0.015+z*0.18,ang=rand(0,Math.PI*2);
    return{x:rand(0,W),y:rand(0,H),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      z,alpha:rand(0.1,0.9),dAlpha:rand(0.001,0.004)*(Math.random()<0.5?1:-1),violet:Math.random()<0.38};
  });
}
function drawStar(cx,cy,alpha,z,violet){
  if(alpha<0.01)return;
  const sc=0.18+z*0.92,sh=0.25+z*0.75,fa=alpha*sh;
  const ri=Math.round(190+z*30),gi=Math.round(150+z*60);
  const color=violet?`${ri},${gi},255`:`${Math.round(200+z*20)},${Math.round(195+z*15)},255`;
  const vL=ARM_V*sc,hL=ARM_H*sc,lw=Math.max(0.3,sc*0.65);
  [[cx,cy,cx,cy-vL],[cx,cy,cx,cy+vL],[cx,cy,cx-hL,cy],[cx,cy,cx+hL,cy]].forEach(([x0,y0,x1,y1])=>{
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    [[0,1],[.08,.92],[.2,.75],[.4,.48],[.65,.20],[.85,.06],[1,0]].forEach(([t,a])=>
      g.addColorStop(t,`rgba(${color},${(fa*a).toFixed(3)})`));
    ctx.save();ctx.strokeStyle=g;ctx.lineWidth=lw;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.restore();
  });
}
function drawStars(){
  ctx.clearRect(0,0,W,H);
  stars.slice().sort((a,b)=>a.z-b.z).forEach(s=>{
    s.x+=s.vx;s.y+=s.vy;
    if(s.x<-20)s.x=W+20;if(s.x>W+20)s.x=-20;
    if(s.y<-20)s.y=H+20;if(s.y>H+20)s.y=-20;
    s.alpha+=s.dAlpha;
    if(s.alpha>=0.88){s.alpha=0.88;s.dAlpha=-Math.abs(s.dAlpha);}
    if(s.alpha<=0.04){s.alpha=0.04;s.dAlpha=Math.abs(s.dAlpha);}
    drawStar(s.x,s.y,Math.log(1+s.alpha*3)/Math.log(4),s.z,s.violet);
  });
  requestAnimationFrame(drawStars);
}
resize();spawnStars();drawStars();
window.addEventListener('resize',()=>{resize();spawnStars();});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{resize();spawnStars();});

document.addEventListener('touchmove',e=>{
  if(e.target.closest('.months-scroll, .days-scroll')){ } else { e.preventDefault(); }
},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ── CONFIGURAZIONE TEMPORALE AUTOMATICA REALE ── */
const START = new Date(2025, 3, 10); // Aprile 2025 (Inizio relazione)
const TODAY = new Date();            // Legge l'orologio reale del dispositivo

function monthsBetween(a, b) {
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}
const CURRENT_MONTH_IDX = monthsBetween(START, TODAY);
const TOTAL_SHOWN = CURRENT_MONTH_IDX + 6; // Mostra fino a 6 mesi nel futuro (bloccati)

const MONTH_NAMES_IT=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
  'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

const WEEK_NAMES_IT=["dom","lun","mar","mer","gio","ven","sab"];

/* ── ARCHIVIO LOCALSTORAGE RICORDI E IMMAGINI REALTIME ── */
let USER_PHOTOS = {};
try {
  const saved = localStorage.getItem('noi_memories_photos');
  if(saved) USER_PHOTOS = JSON.parse(saved);
} catch(e) { console.error("Impossibile caricare le foto salvate", e); }

// Stato globale per tracciare la polaroid correntemente aperta
let activeDayContext = null;

function getMonthData(idx){
  const d = new Date(START.getFullYear(), START.getMonth() + idx, 1);
  const name = MONTH_NAMES_IT[d.getMonth()];
  const year = d.getFullYear();
  const daysInMonth = new Date(year, d.getMonth() + 1, 0).getDate();
  const firstDay = new Date(year, d.getMonth(), 1);
  const lastDay = new Date(year, d.getMonth(), daysInMonth);
  return { idx, name, year, month: d.getMonth(), daysInMonth, firstDay, lastDay, date: d };
}

function monthProgress(idx){
  if(idx < CURRENT_MONTH_IDX) return 1;
  if(idx > CURRENT_MONTH_IDX) return 0;
  return Math.min(1, Math.max(0, (TODAY.getDate() - 1) / (new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate() - 1)));
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    if(s.id.replace('screen-','')===id){ s.classList.remove('hidden'); } 
    else { s.classList.add('hidden'); }
  });
}

/* ── HOME ── */
document.getElementById('home-date').textContent=
  `♥ mese ${CURRENT_MONTH_IDX+1} insieme · ${TODAY.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}`;

document.getElementById('btn-enter').addEventListener('click',()=>{
  buildMonths();
  showScreen('months');
});

/* ── CAROSELLO MAGNETICO MESI DIZIONARIO ── */
function updateCardSizes() {
  const container = document.getElementById('months-scroll');
  const cards = container.querySelectorAll('.month-card');
  const containerCenter = container.scrollLeft + (container.offsetWidth / 2);

  cards.forEach(card => {
    const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
    const distance = Math.abs(containerCenter - cardCenter);
    if (distance < 130) {
      card.classList.add('active-center');
    } else {
      card.classList.remove('active-center');
    }
  });
}

function buildMonths(){
  const container=document.getElementById('months-scroll');
  container.innerHTML='';
  
  for(let i=0; i<TOTAL_SHOWN; i++){
    const md=getMonthData(i);
    const isCurrent = i === CURRENT_MONTH_IDX;
    const isPast = i < CURRENT_MONTH_IDX;
    const isLocked = i > CURRENT_MONTH_IDX;

    const card=document.createElement('div');
    card.className = isLocked ? 'month-card future-locked' : 'month-card';

    const prog=monthProgress(i);
    const badge = isCurrent ? 'current' : (isPast ? 'done' : 'future');
    const badgeLabel = isCurrent ? 'In corso ✦' : (isPast ? 'Vissuto ♥' : 'Bloccato 🔒');
    const hearts=['♥','♡','✦','☽','✿','⊹','◦','✧'];
    const heart=hearts[i%hearts.length];

    const fmt=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
    const dateRange=`${fmt(md.firstDay)} — ${fmt(md.lastDay)}`;

    card.innerHTML=`
      <div class="mc-row">
        <div class="mc-left">
          <span class="mc-num">Mese ${i+1} · ${md.year}</span>
          <span class="mc-name">${md.name}</span>
          <span class="mc-dates">${dateRange}</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          ${isLocked ? `<span class="mc-lock">🔒</span>` : `<span class="mc-heart">${heart}</span>`}
          <span class="mc-badge ${badge}">${badgeLabel}</span>
        </div>
      </div>
      ${!isLocked ? `<div class="mc-progress"><div class="mc-progress-fill" style="width:${(prog*100).toFixed(0)}%"></div></div>` : ''}
    `;

    if(!isLocked){
      // Apertura immediata ed intuitiva sul mese cliccato
      card.addEventListener('click',()=> {
        openMonth(i);
      });
    }
    container.appendChild(card);
  }
  
  container.removeEventListener('scroll', updateCardSizes);
  container.addEventListener('scroll', updateCardSizes);

  setTimeout(() => {
    const cards = container.querySelectorAll('.month-card');
    const targetIdx = CURRENT_MONTH_IDX < TOTAL_SHOWN ? CURRENT_MONTH_IDX : 0;
    if(cards[targetIdx]) {
      cards[targetIdx].scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
    }
    updateCardSizes();
  }, 50);
}
document.getElementById('back-months').addEventListener('click',()=>showScreen('home'));

/* ── DETTAGLIO GIORNI (TUTTI ACCESSIBILI SE PASSATI/CORRENTI) ── */
function openMonth(idx){
  const md=getMonthData(idx);
  document.getElementById('detail-title').textContent=`${md.name} ${md.year}`;
  document.getElementById('detail-sub').textContent=`Mese ${idx+1} · Album di Coppia`;
  buildDays(md, idx);
  showScreen('detail');
}

function buildDays(md, monthIdx){
  const grid=document.getElementById('days-grid');
  grid.innerHTML='';

  for(let d=1; d<=md.daysInMonth; d++){
    const cellDate = new Date(md.year, md.month, d);
    const isDayInFuture = cellDate > TODAY;

    // Generiamo l'identificatore univoco del giorno (es: "2026-3-18")
    const dayKey = `${md.year}-${md.month}-${d}`;
    const savedPhoto = USER_PHOTOS[dayKey];
    
    // Calcoliamo il giorno della settimana corretto
    const dayOfWeekStr = WEEK_NAMES_IT[cellDate.getDay()];

    const card = document.createElement('div');
    card.style.animationDelay = `${(d-1)*0.012}s`;

    if (isDayInFuture) {
      // GIORNO FUTURO: Congelato fino al suo arrivo reale
      card.className = 'day-card day-future-locked fadein';
      card.innerHTML = `
        <div class="day-photo"><div class="day-photo-inner"></div></div>
        <div class="day-footer">
          <span class="day-num">${d}</span>
          <span class="day-label">FUTURO</span>
        </div>
      `;
    } else {
      // GIORNO PASSATO O CORRENTE SBLOCCATO: Sempre cliccabile per inserire/vedere la polaroid
      const hasPhotoClass = savedPhoto ? 'day-card has-uploaded-photo fadein' : 'day-card fadein';
      card.className = hasPhotoClass;
      
      card.innerHTML = `
        <div class="day-photo">
          <div class="day-photo-inner" style="${savedPhoto ? `background-image:url(${savedPhoto});` : ''}"></div>
        </div>
        <div class="day-footer">
          <span class="day-num">${d}</span>
          <span class="day-label">${dayOfWeekStr}</span>
        </div>
      `;
      card.addEventListener('click',()=>openPolaroid(md, d, dayOfWeekStr, dayKey));
    }
    grid.appendChild(card);
  }
}
document.getElementById('back-detail').addEventListener('click',()=>showScreen('months'));

/* ── DETTAGLIO POLAROID CON ROTAZIONE ED UPLOAD IMMAGINI ── */
const bigPol=document.getElementById('big-polaroid');
let polAngleY=0, polAngVelY=0, polGrabbed=false, polLastX=0, polRaf=null;
const DAMP=0.90, MAX_VEL=25, SPRING=0.05, SPRING_TH=0.05;

function applyPol3D(){
  bigPol.style.transform = `rotateY(${polAngleY}deg)`;
  const lightDeg = 120 + (polAngleY * 0.8);
  bigPol.style.setProperty('--light-deg', `${lightDeg}deg`);
}

function polPhysics3D(){
  if(!polGrabbed){
    const rest=0, delta=rest-polAngleY;
    if(Math.abs(delta)<SPRING_TH && Math.abs(polAngVelY)<SPRING_TH){
      polAngleY=rest; polAngVelY=0; applyPol3D(); polRaf=null; return;
    }
    polAngVelY += delta * SPRING;
    polAngVelY *= DAMP;
  }
  polAngleY += polAngVelY;
  polAngleY = Math.max(-65, Math.min(65, polAngleY));
  applyPol3D();
  polRaf=requestAnimationFrame(polPhysics3D);
}

function startPolPhysics(){if(!polRaf) polRaf=requestAnimationFrame(polPhysics3D);}

function openPolaroid(md, day, weekday, dayKey){
  activeDayContext = { md, day, weekday, dayKey };

  let fullWeekday = weekday.toUpperCase();
  if(fullWeekday === "SAB") fullWeekday = "SABATO";
  if(fullWeekday === "LUN") fullWeekday = "LUNEDÌ";
  if(fullWeekday === "DOM") fullWeekday = "DOMENICA";
  if(fullWeekday === "MAR") fullWeekday = "MARTEDÌ";
  if(fullWeekday === "MER") fullWeekday = "MERCOLEDÌ";
  if(fullWeekday === "GIO") fullWeekday = "GIOVEDÌ";
  if(fullWeekday === "VEN") fullWeekday = "VENERDÌ";

  document.getElementById('pol-daytitle').textContent=`${day} ${md.name} ${md.year}`;
  document.getElementById('big-caption').textContent=`${fullWeekday} ${day} ${md.name.toLowerCase()}`;
  
  // Renderizzazione foto se precedentemente memorizzata
  const targetPhotoContainer = document.getElementById('big-photo');
  if(USER_PHOTOS[dayKey]) {
    targetPhotoContainer.style.backgroundImage = `url(${USER_PHOTOS[dayKey]})`;
    document.getElementById('btn-trigger-upload').textContent = "Modifica Foto ♥";
  } else {
    targetPhotoContainer.style.backgroundImage = 'none';
    document.getElementById('btn-trigger-upload').textContent = "Aggiungi Foto ♥";
  }

  polAngleY=0;
  polAngVelY=0;
  applyPol3D();
  showScreen('polaroid');
}

// Chiusura schermata e refresh immediato della griglia per mostrare l'anteprima inserita
document.getElementById('btn-close-pol').addEventListener('click',()=>{
  if(activeDayContext) {
    openMonth(activeDayContext.md.idx);
  }
  showScreen('detail');
});

/* ── LOGICA COMPRESSIONE E SALVATAGGIO FOTO REALTIME ── */
const fileInput = document.getElementById('secure-photo-input');
document.getElementById('btn-trigger-upload').addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file || !activeDayContext) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    const img = new Image();
    img.onload = function() {
      // Ottimizzazione automatica dell'immagine per non saturare la memoria del browser (LocalStorage)
      const canvasOp = document.createElement('canvas');
      const MAX_WIDTH = 750;
      const scale = MAX_WIDTH / img.width;
      
      if(img.width > MAX_WIDTH) {
        canvasOp.width = MAX_WIDTH;
        canvasOp.height = img.height * scale;
      } else {
        canvasOp.width = img.width;
        canvasOp.height = img.height;
      }

      const ctxOp = canvasOp.getContext('2d');
      ctxOp.drawImage(img, 0, 0, canvasOp.width, canvasOp.height);
      
      // Convertiamo in JPEG compresso (qualità 0.72)
      const optimizedBase64 = canvasOp.toDataURL('image/jpeg', 0.72);
      
      // Salvataggio nel database locale ed aggiornamento UI real-time
      USER_PHOTOS[activeDayContext.dayKey] = optimizedBase64;
      localStorage.setItem('noi_memories_photos', JSON.stringify(USER_PHOTOS));
      
      document.getElementById('big-photo').style.backgroundImage = `url(${optimizedBase64})`;
      document.getElementById('btn-trigger-upload').textContent = "Modifica Foto ♥";
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

/* CONTROLLI DI TRASCINAMENTO MOUSE / TOUCH PER ROTAZIONE POLAROID */
bigPol.addEventListener('mousedown',e=>{
  polGrabbed=true; bigPol.classList.add('grabbed');
  polLastX=e.clientX; polAngVelY=0; e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!polGrabbed)return;
  const dx=e.clientX-polLastX, sensitivity=0.35;
  polAngleY += dx * sensitivity;
  polAngVelY = dx * sensitivity * 0.4;
  polLastX=e.clientX;
  applyPol3D();
});
window.addEventListener('mouseup',()=>{
  if(!polGrabbed)return; polGrabbed=false; bigPol.classList.remove('grabbed');
  polAngVelY=Math.max(-MAX_VEL, Math.min(MAX_VEL, polAngVelY)); startPolPhysics();
});

bigPol.addEventListener('touchstart',e=>{
  polGrabbed=true; bigPol.classList.add('grabbed');
  polLastX=e.touches[0].clientX; polAngVelY=0;
  e.stopPropagation();
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(!polGrabbed)return;
  const dx=e.touches[0].clientX-polLastX, sensitivity=0.35;
  polAngleY += dx * sensitivity;
  polAngVelY = dx * sensitivity * 0.4;
  polLastX=e.touches[0].clientX;
  applyPol3D();
},{passive:true});
window.addEventListener('touchend',()=>{
  if(!polGrabbed)return; polGrabbed=false; bigPol.classList.remove('grabbed');
  polAngVelY=Math.max(-MAX_VEL, Math.min(MAX_VEL, polAngVelY)); startPolPhysics();
});

/* FULLSCREEN UTILS */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=navigator.standalone===true
  ||window.matchMedia('(display-mode:fullscreen)').matches
  ||window.matchMedia('(display-mode:standalone)').matches;

function goFS(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req&&!document.fullscreenElement)req.call(el).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!isIOS&&!isStandalone)goFS();});

if(isIOS&&!isStandalone){
  const b=document.createElement('div');b.id='ios-banner';
  b.innerHTML=`<span>Fullscreen: <strong>Condividi</strong> → <strong>Aggiungi a schermata Home</strong></span><button onclick="this.parentElement.remove()">✕</button>`;
  document.body.appendChild(b);setTimeout(()=>b?.remove(),8000);
}else if(!isStandalone){
  document.addEventListener('click',goFS,{once:true});
  document.addEventListener('touchstart',goFS,{once:true,passive:true});
}
</script>
