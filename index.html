<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Noi</title>
  <style>
    /* ── CORREZIONI PER L'INTERAZIONE ── */
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      /* Modificato da 'none' a 'manipulation' per permettere i click */
      touch-action: manipulation; 
      margin: 0; padding: 0;
      font-family: 'Inter', sans-serif;
    }

    /* Assicuriamo che la griglia dei giorni sia interattiva */
    .days-scroll {
      width: 100%; flex: 1;
      overflow-y: auto; 
      touch-action: pan-y; /* Permette lo scroll verticale */
      padding: 20px;
    }

    .day-card {
      cursor: pointer;
      pointer-events: auto !important; /* Forza il click */
      position: relative;
    }

    .day-card.day-future-locked {
      pointer-events: none !important;
      opacity: 0.3;
    }

    /* Il resto del tuo CSS rimane invariato */
    .screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="screen-home" class="screen">
  <h1>Noi</h1>
  <button id="btn-enter" class="btn-enter">Entra ♥</button>
</div>

<div id="screen-months" class="screen hidden">
  <div id="months-scroll" class="months-scroll"></div>
</div>

<div id="screen-detail" class="screen hidden">
  <div class="days-scroll">
    <div id="days-grid" class="days-grid"></div>
  </div>
</div>

<div id="screen-polaroid" class="screen hidden">
  </div>

<script>
/* ── LOGICA DI NAVIGAZIONE A PROVA DI CLICK ── */

// Usiamo la "Event Delegation" sul documento: funziona sempre, 
// anche se la griglia viene ricreata dinamicamente.
document.addEventListener('click', (e) => {
    // Cerchiamo se l'elemento cliccato è una card giorno
    const card = e.target.closest('.day-card');
    
    if (card && !card.classList.contains('day-future-locked')) {
        console.log("Click rilevato sul giorno!");
        
        // Qui richiami la tua funzione originale per aprire la polaroid
        // Esempio:
        // const day = card.dataset.day;
        // openPolaroid(..., day, ...);
    }
});

// Mantieni qui il resto del tuo codice originale (le funzioni di 
// rendering, la fisica delle polaroid, etc.)
// Assicurati che le tue funzioni non contengano 'event.preventDefault()' 
// che bloccano il click.

</script>
</body>
</html>
